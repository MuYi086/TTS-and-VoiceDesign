[project]
name = "mimo-tts-service"
version = "0.1.0"
description = "Unitale MiMo TTS VoiceDesign HTTP service"
requires-python = "==3.12.13"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.uv]
package = false
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
